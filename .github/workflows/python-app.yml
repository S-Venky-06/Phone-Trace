name: Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install .
    - name: Test Phase 2
      run: python -m unittest test_phase2.py
    - name: Test Phase 3
      run: python -m unittest test_phase3.py
    # GUI and AI tests might require xvfb/API keys respectively, so we leave them out of standard CI for now unless configured.
    # - name: Test Phase 4
    #   run: python -m unittest test_phase4.py
    # - name: Test Phase 5
    #   run: python -m unittest test_phase5.py
