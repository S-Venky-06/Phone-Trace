[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-trace"
version = "3.0.0"
description = "AI-Assisted Android Digital Forensic Investigation Workstation"
authors = [
    { name = "PhoneTrace Project" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.5.0",
    "PyQt6-WebEngine>=6.5.0",
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    "folium>=0.16.0"
]

[project.scripts]
phonetrace = "gui.app:main"

[tool.setuptools]
packages = [
    "gui", "parsers", "timeline", "ai_engine", "artifacts", 
    "reporting", "adb_extraction", "anomaly_detection", "evidence_generator"
]

